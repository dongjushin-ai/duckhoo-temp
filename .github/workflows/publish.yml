name: 인스타 자동 발행
on:
  schedule:
    - cron: "0 11 * * *"   # 20:00 KST 큐(월·목 릴스, 화·토 캐러셀) + 금 뉴스 릴스
    - cron: "0 9 * * *"    # 18:00 KST 뉴스
  workflow_dispatch:
    inputs:
      post:
        description: "지금 바로 올릴 편 이름 (비우면 평소대로 일정만)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 일시정지 확인
        id: pause
        run: if [ -f PAUSE ]; then echo "PAUSE 파일이 있어 쉬어요"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: 일정 갱신 + 발행
        if: steps.pause.outputs.skip != '1'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_NOW: ${{ github.event.inputs.post }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "::error::저장소 Secrets 에 IG_TOKEN 이 없어요"; exit 1; fi
          python3 bot/ig_publish.py plan
          if [ -n "$POST_NOW" ]; then
            if [ -f "posts/reels/$POST_NOW.mp4" ]; then python3 bot/ig_publish.py reel "$POST_NOW" --go
            else python3 bot/ig_publish.py publish "$POST_NOW" --go; fi
            python3 bot/ig_publish.py plan
          else
            python3 bot/ig_publish.py run --go
          fi
      - name: 기록 저장
        if: always() && steps.pause.outputs.skip != '1'
        run: |
          git config user.name "duckhoo-bot"
          git config user.email "duckhoo-bot@users.noreply.github.com"
          git add bot/schedule.csv bot/log.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "발행 기록 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
